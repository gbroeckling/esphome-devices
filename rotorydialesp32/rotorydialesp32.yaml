interval:
  - interval: 250ms
    then:
      - lambda: |-
          // When user stops turning for a bit, allow HA feedback again
          if (id(is_adjusting) && millis() > id(adjusting_until_ms)) {
            id(is_adjusting) = false;
            ESP_LOGI("dimmer", "Session end (HA feedback re-enabled)");
          }

script:
  - id: toggle_bit
    parameters:
      bit: int
    then:
      - lambda: |-
          uint16_t m = id(active_mask);
          m ^= (1u << (bit - 1));   // bit is 1..8
          id(active_mask) = m;

          // next knob move should re-snapshot
          id(is_adjusting) = false;
          id(target_tenths) = 0;
          id(baseline_avg_tenths) = 0;
      - script.execute: ui_refresh

  - id: toggle_all
    then:
      - lambda: |-
          id(active_mask) = (id(active_mask) != 0) ? 0x0000 : 0x00FF;

          id(is_adjusting) = false;
          id(target_tenths) = 0;
          id(baseline_avg_tenths) = 0;
      - script.execute: ui_refresh

  - id: knob_tick
    mode: restart
    parameters:
      dir: int
    then:
      - lambda: |-
          // dt must be inside this lambda (fixes compile error)
          uint32_t now = millis();
          uint32_t dt  = now - id(last_tick_ms);
          id(last_tick_ms) = now;

          // Start session if needed (snapshot baselines so reversing is exact)
          if (!id(is_adjusting)) {
            uint16_t m = id(active_mask);

            // snapshot current cached state
            id(b1_pct) = id(e1_pct);
            id(b2_pct) = id(e2_pct);
            id(b3_pct) = id(e3_pct);
            id(b4_pct) = id(e4_pct);
            id(b5_pct) = id(e5_pct);
            id(b6_pct) = id(e6_pct);
            id(b7_pct) = id(e7_pct);
            id(b8_pct) = id(e8_pct);

            int sum=0, cnt=0;
            if (m & 0x01) { sum += id(b1_pct); cnt++; }
            if (m & 0x02) { sum += id(b2_pct); cnt++; }
            if (m & 0x04) { sum += id(b3_pct); cnt++; }
            if (m & 0x08) { sum += id(b4_pct); cnt++; }
            if (m & 0x10) { sum += id(b5_pct); cnt++; }
            if (m & 0x20) { sum += id(b6_pct); cnt++; }
            if (m & 0x40) { sum += id(b7_pct); cnt++; }
            if (m & 0x80) { sum += id(b8_pct); cnt++; }

            int avg = (cnt > 0) ? (int) lround(sum / (double)cnt) : 0;
            avg = std::max(0, std::min(100, avg));

            id(baseline_avg_tenths) = avg * 10;
            id(target_tenths) = id(baseline_avg_tenths);

            id(is_adjusting) = true;
            id(adjusting_until_ms) = millis() + 2500;

            ESP_LOGI("dimmer", "Session start: baseline avg=%d%% mask=0x%04X", avg, (int)m);
          }

          // Perceptual step curve for LEDs: step ~4% of the current level
          // (equal *ratio* steps read as equal brightness changes to the eye),
          // clamped to 0.5%..3.0% per detent. Sub-0.5% steps are below what
          // LED drivers resolve, and fixed 1% steps are invisible up high.
          const int led_min_t = ${led_min_pct} * 10;
          int t = id(target_tenths) + id(pending_delta_tenths);
          t = std::max(0, std::min(1000, t));

          int step_t;
          if (dir > 0 && t < led_min_t) {
            // Skip the LED dead zone: from off, jump straight to the floor
            step_t = led_min_t - t;
          } else if (dir < 0 && t <= led_min_t) {
            // Below/at the floor going down: next detent is clean off
            step_t = t;
          } else {
            step_t = t / 25;                       // ~4% of current level
            step_t = std::max(5, std::min(30, step_t));

            // Speed boost when spinning fast (capped: never more than 10%
            // per detent, so multi-count detents can't produce huge leaps)
            if (dt > 0 && dt < 45) step_t *= 3;
            else if (dt < 90) step_t *= 2;
            step_t = std::min(100, step_t);

            // Don't step down into the dead zone — land on the floor first
            if (dir < 0 && t - step_t < led_min_t) step_t = t - led_min_t;
          }

          id(pending_delta_tenths) += dir * step_t;

          // keep ignoring HA feedback while turning (Control4 lag)
          id(adjusting_until_ms) = millis() + 2500;

      - script.execute: apply_pending_local_only
      - script.execute: ui_refresh
      # Live update while turning (rate-limited), so the lights track the knob...
      - if:
          condition:
            lambda: 'return millis() - id(last_send_ms) > 300;'
          then:
            - script.execute: commit_to_ha
      # ...plus a trailing send so the final resting value always lands.
      - script.execute: commit_trailing

  - id: apply_pending_local_only
    mode: restart
    then:
      - lambda: |-
          int d = id(pending_delta_tenths);
          if (d == 0) return;

          int t = id(target_tenths) + d;
          id(pending_delta_tenths) = 0;

          t = std::max(0, std::min(1000, t));
          id(target_tenths) = t;

  - id: commit_trailing
    mode: restart
    then:
      # Restarted on every detent; fires once the knob has rested 350ms,
      # so the final resting value always reaches HA.
      - delay: 350ms
      - script.execute: commit_to_ha

  - id: commit_to_ha
    mode: restart
    then:
      - lambda: |-
          if (!id(is_adjusting)) return;

          uint16_t m = id(active_mask);
          if (m == 0) return;

          id(last_send_ms) = millis();

          // delta from the exact starting average (in tenths)
          int delta_t = id(target_tenths) - id(baseline_avg_tenths);

          // Per-light target from its own baseline, so returning delta->0
          // returns EXACT baselines. LED floor keeps individual lights out of
          // the 1..(led_min_pct-1)% flicker zone; knob at zero = all off.
          auto shape = [&](int base)->int {
            int v = base + (int) lround(delta_t / 10.0);
            if (v < 0) v = 0;
            if (v > 100) v = 100;
            if (id(target_tenths) == 0) return 0;
            if (v > 0 && v < ${led_min_pct}) v = ${led_min_pct};
            return v;
          };

          int t1 = shape(id(b1_pct));
          int t2 = shape(id(b2_pct));
          int t3 = shape(id(b3_pct));
          int t4 = shape(id(b4_pct));
          int t5 = shape(id(b5_pct));
          int t6 = shape(id(b6_pct));
          int t7 = shape(id(b7_pct));
          int t8 = shape(id(b8_pct));

          // Update cached values immediately so UI stays stable during lag
          if (m & 0x01) id(e1_pct) = t1;
          if (m & 0x02) id(e2_pct) = t2;
          if (m & 0x04) id(e3_pct) = t3;
          if (m & 0x08) id(e4_pct) = t4;
          if (m & 0x10) id(e5_pct) = t5;
          if (m & 0x20) id(e6_pct) = t6;
          if (m & 0x40) id(e7_pct) = t7;
          if (m & 0x80) id(e8_pct) = t8;

          ESP_LOGI("dimmer", "Commit: target=%d.%d%% delta=%d.%d%% mask=0x%04X",
                   id(target_tenths)/10, id(target_tenths)%10,
                   delta_t/10, abs(delta_t)%10, (int)m);

      # Send only to active lights; explicit turn_off at 0% (turn_on with
      # brightness 0 is ambiguous for some integrations, notably Control4)
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x01) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e1_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e1}"
                        brightness_pct: !lambda 'return id(e1_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e1}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x02) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e2_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e2}"
                        brightness_pct: !lambda 'return id(e2_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e2}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x04) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e3_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e3}"
                        brightness_pct: !lambda 'return id(e3_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e3}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x08) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e4_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e4}"
                        brightness_pct: !lambda 'return id(e4_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e4}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x10) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e5_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e5}"
                        brightness_pct: !lambda 'return id(e5_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e5}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x20) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e6_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e6}"
                        brightness_pct: !lambda 'return id(e6_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e6}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x40) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e7_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e7}"
                        brightness_pct: !lambda 'return id(e7_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e7}"
                        transition: "0.25"
      - if:
          condition:
            lambda: 'return (id(active_mask) & 0x80) != 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(e8_pct) > 0;'
                then:
                  - homeassistant.action:
                      action: light.turn_on
                      data:
                        entity_id: "${e8}"
                        brightness_pct: !lambda 'return id(e8_pct);'
                        transition: "0.25"
                else:
                  - homeassistant.action:
                      action: light.turn_off
                      data:
                        entity_id: "${e8}"
                        transition: "0.25"

      - script.execute: ui_refresh

  - id: ui_refresh
    then:
      # ALL button: green only when all active
      - if:
          condition:
            lambda: 'return id(active_mask) == 0x00FF;'
          then:
            - lvgl.obj.update: { id: btn_all, bg_color: 0x145C2A }
          else:
            - lvgl.obj.update: { id: btn_all, bg_color: 0x2B3A4A }

      # Individual buttons green when active
      - if: { condition: { lambda: 'return (id(active_mask) & 0x01) != 0;' }, then: [ { lvgl.obj.update: { id: btn_1, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_1, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x02) != 0;' }, then: [ { lvgl.obj.update: { id: btn_2, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_2, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x04) != 0;' }, then: [ { lvgl.obj.update: { id: btn_3, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_3, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x08) != 0;' }, then: [ { lvgl.obj.update: { id: btn_4, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_4, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x10) != 0;' }, then: [ { lvgl.obj.update: { id: btn_5, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_5, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x20) != 0;' }, then: [ { lvgl.obj.update: { id: btn_6, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_6, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x40) != 0;' }, then: [ { lvgl.obj.update: { id: btn_7, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_7, bg_color: 0x1D2630 } } ] }
      - if: { condition: { lambda: 'return (id(active_mask) & 0x80) != 0;' }, then: [ { lvgl.obj.update: { id: btn_8, bg_color: 0x145C2A } } ], else: [ { lvgl.obj.update: { id: btn_8, bg_color: 0x1D2630 } } ] }

font:
  - file: "gfonts://Montserrat"
    id: font_btn
    size: 24

lvgl:
  displays:
    - round_display
  touchscreens:
    - touch
  buffer_size: 60%
  bg_color: 0x0F1419
  text_color: 0xE6EAF0
  scrollbar_mode: "OFF"

  pages:
    - id: page_dimmer
      widgets:
        - obj:
            x: 0
            y: 0
            width: 480
            height: 480
            bg_color: 0x0F1419
            bg_opa: 100%
            scrollable: false

        # Layout preserved: 4 rows x 2 cols, ALL centered on top
        - button:
            id: btn_all
            x: 140
            y: 48
            width: 200
            height: 64
            bg_color: 0x145C2A
