# Light on/off state: HA drops the brightness attribute when a light is off,
# so without these the cached pct goes stale and off lights pollute the
# session baseline. Off -> cached pct = 0.
text_sensor:
  - platform: homeassistant
    id: e1_state
    entity_id: ${e1}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(is_adjusting) && millis() < id(adjusting_until_ms)) return;
            if (x == "off") id(e1_pct) = 0;
        - script.execute: ui_refresh
  - platform: homeassistant
    id: e2_state
    entity_id: ${e2}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(is_adjusting) && millis() < id(adjusting_until_ms)) return;
