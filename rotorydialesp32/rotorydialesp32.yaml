substitutions:
  name: "matouch-universal-dimmer"
  friendly_name: "MaTouch Universal Dimmer"

  e1: "light.inside_entry"
  e1_name: "Inside Entry"

  e2: "light.kitchen_east"
  e2_name: "Kitchen East"

  e3: "light.kitchen_valance_west"
  e3_name: "Valance West"

  e4: "light.poker_pots"
  e4_name: "Poker Pots"

  e5: "light.valance_far_west"
  e5_name: "Valance Far W"

  e6: "light.pots_main_north"
  e6_name: "Pots Main N"

  e7: "light.pots_north_stair"
  e7_name: "Pots N Stair"

  e8: "light.pots_fireplace"
  e8_name: "Pots Fireplace"

  # Lowest usable LED level (%): below this most LED loads flicker or cut out.
  # Knob skips 1..(this-1): up from 0 jumps straight here, down from here goes to off.
  led_min_pct: "3"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2024.11.0
  name_add_mac_suffix: false
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
    build_flags: "-DBOARD_HAS_PSRAM"
    board_upload.maximum_ram_size: 524288

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  speed: 80MHz
  mode: octal

logger:
  level: DEBUG

mdns:
  disabled: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

ota:
  - platform: esphome

api:
  reboot_timeout: 0s
  on_client_connected:
    then:
      - logger.log: "✅ Connected to Home Assistant API"
  on_client_disconnected:
    then:
      - logger.log: "❌ Disconnected from Home Assistant API"

external_components:
  - source: github://sEbola76/Makerfabs
    components: [ cst826 ]

output:
  - platform: ledc
    pin: GPIO38
    id: backlight_output

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_output
    id: display_backlight
    restore_mode: ALWAYS_ON

i2c:
  - id: i2c_bus
    sda: 17
    scl: 18
    scan: true
    frequency: 400kHz

touchscreen:
  platform: cst826
  id: touch
  i2c_id: i2c_bus
  skip_probe: true
  update_interval: 25ms
  on_touch:
    - light.turn_on: display_backlight

spi:
  id: spi_bus
  mosi_pin: GPIO0
  clk_pin: GPIO46

display:
  - platform: st7701s
    id: round_display
    auto_clear_enabled: false
    color_order: rgb
    data_rate: 10MHz
    spi_mode: MODE3
    dimensions:
      width: 480
      height: 480
    cs_pin: GPIO1
    de_pin: GPIO2
    hsync_pin: GPIO3
    vsync_pin: GPIO42
    pclk_pin: GPIO45
    pclk_frequency: 12MHz
    pclk_inverted: false
    hsync_front_porch: 10
    hsync_pulse_width: 8
    hsync_back_porch: 50
    vsync_front_porch: 10
    vsync_pulse_width: 8
    vsync_back_porch: 20
    data_pins:
      red:   [11, 15, 12, 16, 21]
      green: [39, 7, 47, 8, 48, 9]
      blue:  [4, 41, 5, 40, 6]

    # Full init sequence (kept exactly to avoid breaking the panel)
    init_sequence:
      - [0x01]
      - delay 120ms
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x3B, 0x00]
      - [0xC1, 0x0B, 0x02]
      - [0xC2, 0x00, 0x02]
      - [0xCC, 0x10]
      - [0xCD, 0x08]
      - [0xB0, 0x02, 0x13, 0x1B, 0x0D, 0x10, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xB1, 0x05, 0x13, 0x1B, 0x0D, 0x11, 0x05, 0x08, 0x07, 0x07, 0x24, 0x04, 0x11, 0x0E, 0x2C, 0x33, 0x1D]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x5D]
      - [0xB1, 0x43]
      - [0xB2, 0x81]
      - [0xB3, 0x80]
      - [0xB5, 0x43]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC1, 0x78]
      - [0xC2, 0x78]
      - [0xD0, 0x88]
      - [0xE0, 0x00, 0x00, 0x02]
      - [0xE1, 0x03, 0xA0, 0x00, 0x00, 0x04, 0xA0, 0x00, 0x00, 0x00, 0x20, 0x20]
      - [0xE2, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE3, 0x00, 0x00, 0x11, 0x00]
      - [0xE4, 0x22, 0x00]
      - [0xE5, 0x05, 0xEC, 0xA0, 0xA0, 0x07, 0xEE, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xE6, 0x00, 0x00, 0x11, 0x00]
      - [0xE7, 0x22, 0x00]
      - [0xE8, 0x06, 0xED, 0xA0, 0xA0, 0x08, 0xEF, 0xA0, 0xA0, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
      - [0xEB, 0x00, 0x00, 0x40, 0x40, 0x00, 0x00, 0x00]
      - [0xED, 0xFF, 0xFF, 0xFF, 0xBA, 0x0A, 0xBF, 0x45, 0xFF, 0xFF, 0x54, 0xFB, 0xA0, 0xAB, 0xFF, 0xFF, 0xFF]
      - [0xEF, 0x10, 0x0D, 0x04, 0x08, 0x3F, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x00]
      - [0x36, 0x08]
      - [0x3A, 0x60]
      - [0x11]
      - delay 100ms
      - [0x29]
      - delay 50ms

globals:
  # Active mask: bit0..bit7 = e1..e8 (1 = included in dimming)
  - id: active_mask
    type: uint16_t
    restore_value: yes
    initial_value: "0x00FF"

  # Last-known HA brightness % for each light (0..100)
  - id: e1_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e2_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e3_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e4_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e5_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e6_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e7_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: e8_pct
    type: int
    restore_value: no
    initial_value: "0"

  # Baseline snapshot at start of an "adjusting session" (exact reversibility)
  - id: b1_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b2_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b3_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b4_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b5_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b6_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b7_pct
    type: int
    restore_value: no
    initial_value: "0"
  - id: b8_pct
    type: int
    restore_value: no
    initial_value: "0"

  # 0..1000 where 1000 = 100.0%
  - id: baseline_avg_tenths
    type: int
    restore_value: no
    initial_value: "0"
  - id: target_tenths
    type: int
    restore_value: no
    initial_value: "0"
  - id: pending_delta_tenths
    type: int
    restore_value: no
    initial_value: "0"

  - id: tmp_pct
    type: int
    restore_value: no
    initial_value: "0"

  - id: last_tick_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: last_send_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # During knob movement: ignore laggy HA feedback so UI doesn't bounce
  - id: is_adjusting
    type: bool
    restore_value: no
    initial_value: "false"
  - id: adjusting_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

binary_sensor:
  - platform: gpio
    name: "Knob Button"
    id: knob_button
    internal: true
    pin:
      number: GPIO14
      inverted: true
    on_press:
      then:
        - light.turn_on: display_backlight
        - script.execute: toggle_all

sensor:
  - platform: rotary_encoder
    id: encoder
    name: "encoder"
    pin_a: GPIO10
    pin_b: GPIO13
    resolution: 1
    on_clockwise:
      then:
        - light.turn_on: display_backlight
        - script.execute: { id: knob_tick, dir: 1 }
    on_anticlockwise:
      then:
        - light.turn_on: display_backlight
        - script.execute: { id: knob_tick, dir: -1 }

  - platform: homeassistant
    id: e1_brightness_255
    entity_id: ${e1}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            // If user is actively adjusting, ignore laggy feedback.
            if (id(is_adjusting) && millis() < id(adjusting_until_ms)) return;

            if (!isnan(x)) {
              int pct = (int) lround((x / 255.0) * 100.0);
              id(e1_pct) = std::max(0, std::min(100, pct));
            }
        - script.execute: ui_refresh

  - platform: homeassistant
    id: e2_brightness_255
    entity_id: ${e2}
    attribute: brightness
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(is_adjusting) && millis() < id(adjusting_until_ms)) return;
