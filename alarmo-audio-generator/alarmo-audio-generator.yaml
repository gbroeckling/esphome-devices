substitutions:
  name: alarmo-respeaker-lite-va
  friendly_name: "Alarmo ReSpeaker Lite VA"
  ap_ssid: "AlarmoVA-Fallback"

  # Home Assistant entities
  alarm_entity: alarm_control_panel.alarmo

  # Piper TTS provider entity in HA
  tts_entity: tts.piper

  # Confirmed HA media_player entity id
  ha_media_player: media_player.alarmo_respeaker_lite_va_alarmo_respeaker_lite_va

  exit_delay_seconds: "30"
  entry_delay_seconds: "30"
  triggered_repeat_seconds: "10"

  default_volume: "0.70"

esphome:
  project:
    name: "gbroeckling.alarmo-audio-generator"
    version: "1.0.0"
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - media_player.volume_set:
          id: respeaker_player
          volume: ${default_volume}
      - delay: 2s
      - micro_wake_word.start:

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  level: INFO

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${ap_ssid}"
    password: "changeme"

captive_portal:

psram:
  mode: octal
  speed: 80MHz

# ---------- ReSpeaker Lite audio wiring ----------
i2c:
  sda: GPIO5
  scl: GPIO6
  scan: true
  frequency: 400kHz

audio_dac:
  - platform: aic3204
    id: codec
    address: 0x18

# Two logical buses on the same physical pins (formatBCE reference pattern).
# MIC = primary/clock master (always capturing for the wake engine, so clocks
# never stop); SPEAKER = secondary at the same 16k/32bit format, riding the
# mic clocks, timeout 500ms. History: 16k-mic/48k-speaker on one shared bus
# broke the speaker once mww actually ran; speaker-as-primary with timeout
# never starved mww (continuous ring-buffer overflow).
i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true
  - id: i2s_input
    i2s_lrclk_pin:
      number: GPIO7
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO8
      allow_other_uses: true
    i2s_mclk_pin:
      number: GPIO9
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: respeaker_mic
    i2s_audio_id: i2s_input
    i2s_din_pin: GPIO44
    adc_type: external
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: left

speaker:
  - platform: i2s_audio
    id: respeaker_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO43
    i2s_mode: secondary
    dac_type: external
    audio_dac: codec
    sample_rate: 16000
    bits_per_sample: 32bit
    channel: stereo
    buffer_duration: 100ms
    timeout: 500ms

media_player:
  - platform: speaker
    id: respeaker_player
    name: "${friendly_name}"
    announcement_pipeline:
      speaker: respeaker_speaker
      format: FLAC
      num_channels: 2
      sample_rate: 16000

# Headphone volume control in HA (0..100%)
number:
  - platform: template
    id: hp_volume
    name: "Headphone Volume"
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 70
    optimistic: true
    on_value:
      then:
        - media_player.volume_set:
            id: respeaker_player
            volume: !lambda "return x / 100.0f;"

# -------- Wake word: hey_jarvis --------
# MUST be built with the 2026.7.3 venv — the 2026.2.1 tflite runtime cannot
# load current mww models (silent engine stop = deaf device, the Atom bug)
micro_wake_word:
  id: mww
  microphone:
    microphone: respeaker_mic
    channels: 0
    gain_factor: 4
  stop_after_detection: true
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json
      probability_cutoff: 0.90
      sliding_window_size: 3
  on_wake_word_detected:
    - logger.log:
        format: "Wake word detected: %s"
        args: ["wake_word.c_str()"]
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

# Voice Assistant (tuning cloned from the working Atom EchoS3R)
voice_assistant:
  microphone:
    microphone: respeaker_mic
    channels: 0
    gain_factor: 4
  media_player: respeaker_player
  use_wake_word: false
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0

  on_client_connected:
    - logger.log: "VA: HA connected"
    - micro_wake_word.start:
  on_client_disconnected:
    - logger.log: "VA: HA disconnected"

  on_listening:
    - logger.log: "VA: listening"

  on_stt_vad_start:
    - logger.log: "VA: STT VAD start"

  on_intent_start:
    - logger.log: "VA: intent start"

  on_tts_start:
    - logger.log: "VA: TTS start"
    # Keep the mic (clock master) running during the reply, or the secondary
    # speaker has no clocks and the reply is silent
    - micro_wake_word.start:

  on_tts_end:
    - logger.log: "VA: TTS end"

  on_end:
    - logger.log: "VA: end"
    - wait_until:
        condition:
          media_player.is_idle:
            id: respeaker_player
        timeout: 30s
    - micro_wake_word.start:

  on_error:
    - logger.log:
        level: WARN
        format: "VA error"
    - micro_wake_word.start:

# -------- Alarmo state from HA --------
text_sensor:
  - platform: homeassistant
    id: alarmo_state
    entity_id: ${alarm_entity}
    on_value:
      then:
        - logger.log:
            format: "Alarmo state: %s"
            args: ['x.c_str()']

        - if:
            condition:
              lambda: return x != "triggered";
            then:
              - script.stop: triggered_repeat

        - if:
            condition:
              lambda: return x == "disarmed";
            then:
              - script.stop: exit_countdown
              - script.stop: entry_countdown
              - script.execute:
                  id: say_tts
                  msg: "Alarm disarmed."

        - if:
            condition:
              lambda: return x == "arming";
            then:
              - script.stop: entry_countdown
              - script.execute:
                  id: say_tts
                  msg: "Arming. Exit delay started."
              - script.execute: exit_countdown

        - if:
            condition:
              lambda: return x.rfind("armed_", 0) == 0;
            then:
              - script.stop: exit_countdown
              - script.execute:
                  id: say_tts
                  msg: !lambda |-
                    std::string pretty = x;
                    for (auto &c : pretty) if (c == '_') c = ' ';
                    return std::string("Alarm ") + pretty + ".";

        - if:
            condition:
              lambda: return x == "pending";
            then:
              - script.stop: exit_countdown
              - script.execute:
                  id: say_tts
                  msg: "Entry delay. Disarm now."
              - script.execute: entry_countdown

        - if:
            condition:
              lambda: return x == "triggered";
            then:
              - script.stop: exit_countdown
              - script.stop: entry_countdown
              - script.execute:
                  id: say_tts
                  msg: "Alarm activated."
              - script.execute: triggered_repeat

button:
  - platform: template
    name: "Alarmo Debug Speak State"
    on_press:
      then:
        - script.execute:
            id: say_tts
            msg: !lambda |-
              return std::string("Alarm state is ") + id(alarmo_state).state + ".";

  # Manual VA test button (bypasses wake word)
  - platform: template
    name: "VA Test: Start Listening"
    on_press:
      then:
        - logger.log: "Manual VA start"
        - voice_assistant.start

script:
  - id: say_tts
    mode: queued
    parameters:
      msg: string
    then:
      - media_player.volume_set:
          id: respeaker_player
          volume: !lambda "return id(hp_volume).state / 100.0f;"
      - delay: 100ms

      - homeassistant.service:
          service: media_player.stop
          data:
            entity_id: ${ha_media_player}
      - delay: 200ms

      - homeassistant.service:
          service: tts.speak
          data:
            entity_id: ${tts_entity}
            media_player_entity_id: ${ha_media_player}
            message: !lambda "return msg;"
            cache: "true"

  - id: exit_countdown
    mode: restart
    then:
      - lambda: id(exit_remaining) = atoi("${exit_delay_seconds}");
      - while:
          condition:
            lambda: return id(alarmo_state).state == "arming" && id(exit_remaining) > 0;
          then:
            - if:
                condition:
                  lambda: |-
                    int s = id(exit_remaining);
                    return (s==30 || s==20 || s==10 || s==5 || s==3 || s==2 || s==1);
                then:
                  - script.execute:
                      id: say_tts
                      msg: !lambda |-
                        char buf[64];
                        snprintf(buf, sizeof(buf), "Arming in %d seconds.", id(exit_remaining));
                        return std::string(buf);
            - delay: 1s
            - lambda: id(exit_remaining)--;

  - id: entry_countdown
    mode: restart
    then:
      - lambda: id(entry_remaining) = atoi("${entry_delay_seconds}");
      - while:
          condition:
            lambda: return id(alarmo_state).state == "pending" && id(entry_remaining) > 0;
          then:
            - if:
                condition:
                  lambda: |-
                    int s = id(entry_remaining);
                    return (s==30 || s==20 || s==10 || s==5 || s==3 || s==2 || s==1);
                then:
                  - script.execute:
                      id: say_tts
                      msg: !lambda |-
                        char buf[64];
                        snprintf(buf, sizeof(buf), "Disarm in %d seconds.", id(entry_remaining));
                        return std::string(buf);
            - delay: 1s
            - lambda: id(entry_remaining)--;

  - id: triggered_repeat
    mode: restart
    then:
      - while:
          condition:
            lambda: return id(alarmo_state).state == "triggered";
          then:
            - script.execute:
                id: say_tts
                msg: "Alarm activated."
            - delay: !lambda |-
                return (uint32_t) (atoi("${triggered_repeat_seconds}") * 1000);

globals:
  - id: exit_remaining
    type: int
    restore_value: no
    initial_value: "0"
  - id: entry_remaining
    type: int
    restore_value: no
    initial_value: "0"

dashboard_import:
  package_import_url: github://gbroeckling/esphome-devices/alarmo-audio-generator/alarmo-audio-generator.yaml@main
  import_full_config: true

