# =========================
# Globals
# =========================
interval:
  # Car-door timer tick
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return id(cd7_running) && id(cd7_remaining_s) > 0;"
          then:
            - lambda: |-
                id(cd7_remaining_s) -= 1;
                if (id(cd7_remaining_s) < 0) id(cd7_remaining_s) = 0;
            - script.execute: cd7_publish
            - script.execute: refresh_car_timed_btn
            - if:
                condition:
                  lambda: "return id(cd7_remaining_s) == 0;"
                then:
                  - script.execute: car_timer_finish

globals:
  # Car-door timer state
  - id: cd7_remaining_s
    type: int
    restore_value: no
    initial_value: "0"
  - id: cd7_running
    type: bool
    restore_value: no
    initial_value: "false"
  - id: cd7_btn_long
    type: bool
    restore_value: no
    initial_value: "false"
  - id: pending_brightness_pct
    type: int
    restore_value: no
    initial_value: "50"
  # 0 = slider drives the dimmer group; 1-10 = slider drives one LED unit
  - id: slider_target
    type: int
    restore_value: no
    initial_value: "0"
  - id: t2_sel
    type: bool
    restore_value: no
    initial_value: "false"
  - id: t3_sel
    type: bool
    restore_value: no
    initial_value: "false"
  - id: t4_sel
    type: bool
    restore_value: no
    initial_value: "false"
  - id: t5_sel
    type: bool
    restore_value: no
    initial_value: "false"
  - id: t6_sel
    type: bool
    restore_value: no
    initial_value: "false"
  - id: t8_sel
    type: bool
    restore_value: no
    initial_value: "false"
  - id: w1_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: w2_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: w3_on
    type: bool
    restore_value: no
    initial_value: "false"
  - id: car_last_ms
    type: uint32_t
