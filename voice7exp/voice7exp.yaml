# =========================
# UI (LVGL) — Portrait 600x1024
# =========================
lvgl:
  displays:
    - tft_display
  rotation: 90
  touchscreens:
    - touchscreen_id: my_touchscreen
      long_press_time: 2s
  update_interval: never
  on_ready:
    then:
      - script.execute: refresh_all_button_styles
      - script.execute: refresh_clock
  pages:
    - id: page_dimmer
      widgets:
        - obj:
            x: 0
            y: 0
            width: 600
            height: 1024
            bg_color: 0x0B0F14
            bg_grad_color: 0x0A0E14
            bg_grad_dir: VER
            bg_opa: 100%
        # ── Header: live clock + date, voice chip (tap = talk) ──
        - obj:
            id: header_card
            x: 20
            y: 8
            width: 560
            height: 96
            radius: 16
            bg_color: 0x121926
            bg_grad_color: 0x0A0E14
            bg_grad_dir: VER
            border_width: 1
            border_color: 0x22304A
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: clock_lbl
                  x: 18
                  y: 8
                  text: "--:--"
                  text_font: font_clock
                  text_color: 0xF2F6FC
              - label:
                  id: date_lbl
                  x: 21
                  y: 68
                  text: ""
                  text_font: font_date
                  text_color: 0x7A8CA5
              - label:
                  id: va_resp_lbl
                  x: 196
                  y: 40
                  width: 168
                  text: ""
                  text_font: font_date
                  text_color: 0x9FB4CC
                  long_mode: scroll_circular
        - button:
            id: vbtn
            x: 400
            y: 20
            width: 164
            height: 72
            radius: 36
            bg_color: 0x18202E
            bg_grad_color: 0x0A0E14
            bg_grad_dir: VER
            border_width: 1
            border_color: 0x2A3A55
            on_press:
              - script.execute: va_chip_press
            widgets:
              - label:
                  id: vlbl
                  text: "READY"
                  text_font: font_chip
                  text_color: 0x7A8CA5
                  align: center
        # Row 1: CAR DOOR TIMED-OPEN — 5 min car door + garage lights,
        # auto-close at zero, each press while running doubles the time.
        # Published Garage Timer Active/MMSS feed the 64x64 matrix displays.
        - button:
            id: btn1
            x: 20
            y: 112
            width: 560
            height: 78
            radius: 14
            bg_color: 0x34D399
            bg_grad_color: 0x0A0E14
            bg_grad_dir: VER
            # Tap = start 5-min timer / double remaining. Hold 2s = cancel:
            # timer stops, garage lights off, car door closed.
            on_press:
              - lambda: 'id(cd7_btn_long) = false;'
            on_long_press:
              - lambda: 'id(cd7_btn_long) = true;'
              - script.execute: car_timer_finish
            on_release:
              - if:
                  condition:
                    lambda: 'return !id(cd7_btn_long);'
                  then:
                    - script.execute: car_timer_press
            widgets:
              - label:
                  id: lbl1
                  text: "CAR DOOR - 5 MIN TIMER"
                  text_font: font_btn
                  text_color: 0x000000
                  align: center
        # Row 2
        - button:
            id: btn2
            x: 20
            y: 370
            width: 270
            height: 78
            radius: 14
            bg_color: 0x5B7CFF
            bg_grad_color: 0x0A0E14
            bg_grad_dir: VER
            on_press:
              - script.execute:
                  id: toggle_dimmer_select
                  idx: 2
            widgets:
