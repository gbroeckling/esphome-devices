  - id: truck_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# =========================
# Scripts
# =========================
script:
  - id: refresh_clock
    then:
      - lvgl.label.update:
          id: clock_lbl
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("--:--");
            char b[6];
            snprintf(b, sizeof(b), "%02d:%02d", now.hour, now.minute);
            return std::string(b);
      - lvgl.label.update:
          id: date_lbl
          text: !lambda |-
            auto now = id(ha_time).now();
            if (!now.is_valid()) return std::string("");
            static const char* D[] = {"Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"};
            static const char* M[] = {"Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"};
            char b[40];
            snprintf(b, sizeof(b), "%s, %s %d", D[now.day_of_week - 1], M[now.month - 1], now.day_of_month);
            return std::string(b);
  - id: voice_state_idle
    then:
      - lvgl.button.update: { id: vbtn, bg_color: 0x18202E, border_color: 0x2A3A55 }
      - lvgl.label.update: { id: vlbl, text: "READY", text_color: 0x7A8CA5 }
  - id: voice_state_listening
    then:
      - lvgl.button.update: { id: vbtn, bg_color: 0x0E3A46, border_color: 0x4FE3FF }
      - lvgl.label.update: { id: vlbl, text: "LISTENING", text_color: 0x4FE3FF }
  - id: voice_state_thinking
    then:
      - lvgl.button.update: { id: vbtn, bg_color: 0x241A3E, border_color: 0xB197FF }
      - lvgl.label.update: { id: vlbl, text: "THINKING", text_color: 0xB197FF }
  - id: voice_state_speaking
    then:
      - lvgl.button.update: { id: vbtn, bg_color: 0x3A2A10, border_color: 0xFFB020 }
      - lvgl.label.update: { id: vlbl, text: "SPEAKING", text_color: 0xFFB020 }
  - id: va_chip_press
    mode: restart
    then:
      - if:
          condition:
            voice_assistant.is_running:
          then:
            - voice_assistant.stop:
            - script.execute: voice_state_idle
          else:
            - micro_wake_word.stop:
            - voice_assistant.start:
  # ── Car-door timer: open car door + garage lights for 5 min, auto-close
  #    at zero; every press while running doubles the remaining time. ──
  - id: car_timer_press
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(cd7_running) && id(cd7_remaining_s) > 0;"
          then:
            - lambda: |-
                const int max_s = 99*60 + 59;   // display cap 99:59
                int s = id(cd7_remaining_s) * 2;
                if (s > max_s) s = max_s;
                id(cd7_remaining_s) = s;
          else:
            - lambda: |-
                id(cd7_running) = true;
                id(cd7_remaining_s) = 300;
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: ${garage_lights}
            # contact ON = door CLOSED (inverted); only pulse the opener if closed
            - if:
                condition:
                  binary_sensor.is_on: car_door_contact
                then:
                  - homeassistant.service:
                      service: switch.toggle
                      data:
                        entity_id: switch.upper_garage_car_door
      - script.execute: cd7_publish
      - script.execute: refresh_car_timed_btn
  - id: car_timer_finish
    mode: restart
    then:
      - lambda: |-
          id(cd7_running) = false;
          id(cd7_remaining_s) = 0;
      # contact OFF = door OPEN; only pulse the opener if it is still open
      - if:
          condition:
            binary_sensor.is_off: car_door_contact
          then:
            - homeassistant.service:
                service: switch.toggle
                data:
                  entity_id: switch.upper_garage_car_door
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: ${garage_lights}
      - script.execute: cd7_publish
      - script.execute: refresh_car_timed_btn
  - id: cd7_publish
    then:
      - binary_sensor.template.publish:
          id: garage_timer_active_pub
          state: !lambda "return id(cd7_running) && id(cd7_remaining_s) > 0;"
      - text_sensor.template.publish:
          id: garage_timer_mmss_pub
          state: !lambda |-
            int s = id(cd7_remaining_s);
            int mm = s / 60;
            int ss = s % 60;
            if (mm > 99) mm = 99;
            char buf[5];
            snprintf(buf, sizeof(buf), "%02d%02d", mm, ss);
            return std::string(buf);
  - id: refresh_car_timed_btn
    then:
      - lvgl.button.update:
          id: btn1
          bg_color: !lambda |-
            bool act = id(cd7_running) && id(cd7_remaining_s) > 0;
            return act ? lv_color_hex(0xFFB020) : lv_color_hex(0x34D399);
      - lvgl.label.update:
          id: lbl1
          text: !lambda |-
            if (!(id(cd7_running) && id(cd7_remaining_s) > 0))
              return std::string("CAR DOOR - 5 MIN TIMER");
            int s = id(cd7_remaining_s);
            char buf[48];
            snprintf(buf, sizeof(buf), "CAR CLOSES IN %d:%02d - TAP = X2", s / 60, s % 60);
            return std::string(buf);
  - id: wled_slider_select
    parameters:
      tgt: int
    then:
      - lambda: |-
          id(slider_target) = tgt;
          float b = NAN;
          switch (tgt) {
            case 1: b = id(w1_bri).state; break;
            case 2: b = id(w2_bri).state; break;
            case 3: b = id(w3_bri).state; break;
            case 4: b = id(w4_bri).state; break;
            case 5: b = id(w5_bri).state; break;
            case 6: b = id(w6_bri).state; break;
            case 7: b = id(w7_bri).state; break;
            case 8: b = id(w8_bri).state; break;
            case 9: b = id(e11_bri).state; break;
            case 10: b = id(e12_bri).state; break;
          }
          int pct = isnan(b) ? 0 : (int) lround(b / 255.0 * 100.0);
          if (pct > 100) pct = 100;
          id(pending_brightness_pct) = pct;
      - lvgl.slider.update:
          id: bright_slider
          value: !lambda 'return (float) id(pending_brightness_pct);'
      - script.execute: refresh_slider_label
  - id: refresh_slider_label
    then:
      - lvgl.label.update:
          id: slider_pct_lbl
          text: !lambda |-
            const char* n = "";
            switch (id(slider_target)) {
            case 1: n = "GLED"; break;
            case 2: n = "SR2"; break;
            case 3: n = "UPPER"; break;
            case 4: n = "GYVER"; break;
            case 5: n = "PILL"; break;
            case 6: n = "QFW-V"; break;
            case 7: n = "CLOSET"; break;
            case 8: n = "OFFICE"; break;
            case 9: n = "QUIN"; break;
            case 10: n = "DOM"; break;
            }
            char b[24];
            if (id(pending_brightness_pct) == 0)
              snprintf(b, sizeof(b), "%s%sOFF", n, id(slider_target) ? " " : "");
            else
              snprintf(b, sizeof(b), "%s%s%d%%", n, id(slider_target) ? " " : "", id(pending_brightness_pct));
            return std::string(b);
